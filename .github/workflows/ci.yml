name: CI

# This repository's own CI: it calls its own reusable workflows (at this
# commit, through local `./` references) on itself and on the fixtures
# under tests/fixtures, so a change to one is exercised before any other
# repository pins it.
#
#   - scripts-lint.yml on this repository: shellcheck/shfmt (no *.sh yet),
#     ruff, mypy, actionlint over these workflows, hadolint over the
#     fixture Dockerfile, lint-containers.py; then scripts/tests;
#   - identity.yml on this repository's commits;
#   - licence.yml: this repository's LICENSE is the canonical AGPL text;
#   - dependency-scan.yml over uv.lock;
#   - the Renovate preset and config, through renovate-config-validator;
#   - actions/paths-changed against the fixtures;
#   - image.yml and helm-chart.yml on the fixtures: built and linted on
#     every run; pushed (to ghcr.io/<owner>/ci-selftest/...), signed with
#     actions/cosign-sign and verified only by a manual run with `publish`
#     on the default branch.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Also push, sign and verify the self-test image and chart (ghcr.io/<owner>/ci-selftest)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts-lint:
    uses: ./.github/workflows/scripts-lint.yml

  commit-identity:
    uses: ./.github/workflows/identity.yml

  licence:
    uses: ./.github/workflows/licence.yml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml
    permissions:
      contents: read
      checks: write
      issues: write

  renovate-config:
    name: renovate-config-validator --strict
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The version the Distant Signal repositories validate with.
      - name: Validate renovate.json5 (repo config) and renovate/default.json5 (the preset)
        run: |
          set -euo pipefail
          npx --yes --package renovate@44.167.5 -- renovate-config-validator --strict
          npx --yes --package renovate@44.167.5 -- renovate-config-validator --strict --no-global renovate/default.json5

  paths-changed:
    name: actions/paths-changed
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: An unknown base counts as changed
        id: unknown
        uses: ./actions/paths-changed
        with:
          base: "0000000000000000000000000000000000000000"
          paths: tests/fixtures/

      - name: HEAD against itself is unchanged
        id: same
        uses: ./actions/paths-changed
        with:
          base: ${{ github.sha }}
          paths: tests/fixtures/ scripts/

      - name: Check the answers
        env:
          UNKNOWN: ${{ steps.unknown.outputs.changed }}
          SAME: ${{ steps.same.outputs.changed }}
        run: |
          set -euo pipefail
          echo "unknown base: ${UNKNOWN}; HEAD vs HEAD: ${SAME}"
          [[ "${UNKNOWN}" == true && "${SAME}" == false ]]

  selftest-image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      service: selftest
      dockerfile: tests/fixtures/image/Dockerfile
      registry-path: ci-selftest
      title-prefix: distant-signal-ci
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      rebuild-runtime: true

  selftest-chart:
    uses: ./.github/workflows/helm-chart.yml
    permissions:
      contents: read
      packages: write
    with:
      chart: tests/fixtures/chart
      lint-values: |
        tests/fixtures/chart/values-other.yaml
      registry-path: ci-selftest/charts
      app-version: sha-${{ github.sha }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

  # Only after a publish: the image was signed inside image.yml (identity:
  # image.yml), the chart is signed here (identity: this workflow), and both
  # are verified.
  selftest-sign:
    name: sign and verify the published self-tests
    needs: [selftest-image, selftest-chart]
    if: needs.selftest-chart.outputs.digest != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log into ghcr.io (cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and verify the chart (actions/cosign-sign)
        uses: ./actions/cosign-sign
        with:
          ref: ${{ needs.selftest-chart.outputs.ref }}@${{ needs.selftest-chart.outputs.digest }}
          verify-identity: ${{ github.server_url }}/${{ github.workflow_ref }}

      - name: Verify the image's signature (signed by image.yml)
        env:
          IMAGE: ${{ needs.selftest-image.outputs.image }}@${{ needs.selftest-image.outputs.digest }}
          IDENTITY_REGEXP: ^${{ github.server_url }}/${{ github.repository }}/\.github/workflows/image\.yml@
        run: |
          cosign verify "${IMAGE}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" > /dev/null
